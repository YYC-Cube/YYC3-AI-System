allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true

# 安全修复覆盖 (Security overrides)
# 由 `pnpm audit` 扫描得出的间接依赖漏洞，统一提升到已修复版本。
# 说明: 选择器 (name@range) 精确匹配受影响的版本区间，避免不同 major 互相污染。
overrides:
  # ── 构建工具链 ──
  vite: ^6.4.4
  postcss@<=8.5.22: ^8.5.30
  browserslist@<=4.28.6: ^4.29.3
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  "@babel/core@<=7.29.0": ^7.29.6
  "@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3": ^7.29.4
  # ── 通配/正则 (间接依赖) ──
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=3.0.0: ^5.0.12
  picomatch@<2.3.2: ^2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.7
  nanoid@<3.3.18: ^3.3.18
  # ── 序列化 / 归档 ──
  serialize-javascript@<=7.0.4: ^7.1.2
  tar@<=7.5.20: ^7.5.22
  # ── 网络 / 解析 ──
  undici@>=7.0.0 <7.29.1: ^7.29.1
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  "@humanfs/node@<0.16.8": ^0.16.8
  # ── Markdown ──
  markdown-it@<14.3.1: ^14.3.1
  linkify-it@<=5.0.1: ^5.0.2
  # ── 运行时库 ──
  lodash@<=4.17.23: ^4.18.1
  dompurify@<=3.4.15: ^3.4.17
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  prosemirror-view@<1.42.3: ^1.42.6
  react-router@>=6.0.0 <7.18.4: ^7.18.4
  "@tiptap/core@<3.30.5": ^3.32.0
